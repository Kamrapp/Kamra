name: kamra-local

services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${MONGODB_DB_NAME:-kamra_dev}
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - kamra-mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", 'mongosh --quiet --eval "db.adminCommand({ ping: 1 }).ok" | grep 1']
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        API_BASE_URL: ""
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      STATIC_ROOT: /app/dist/kamra-web/browser
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017}
      MONGODB_DB_NAME: ${MONGODB_DB_NAME:-kamra_dev}
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:-local-docker-only-change-me}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      CORS_ALLOWED_ORIGIN_PATTERNS: ${CORS_ALLOWED_ORIGIN_PATTERNS:-}
      KAMRA_AUTO_SEED: ${KAMRA_AUTO_SEED:-1}
      SEED_ADMINUSER_USERNAME: ${SEED_ADMINUSER_USERNAME:-admin@example.test}
      SEED_ADMINUSER_PASSWORD: ${SEED_ADMINUSER_PASSWORD:-local-admin-password}
      SEED_CATALOG_V1: ${SEED_CATALOG_V1:-1}
      SEED_DEMO_HOUSEHOLD_PASSWORD: ${SEED_DEMO_HOUSEHOLD_PASSWORD:-local-demo-password}
    ports:
      - "127.0.0.1:${APP_PORT:-4200}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  kamra-mongo-data:
