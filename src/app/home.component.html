@if (!auth.isAuthenticated()) {
  <app-household-preview-workspace
    [previewStockItems]="previewStockItems()"
    [previewEditorItem]="previewEditorItem()"
    [demoShoppingList]="demoShoppingList()"
    [shoppingScale]="apiShoppingScale()"
  />
} @else {
  <section class="stock-workspace" aria-labelledby="home-title">
    <app-household-v2-workspace [householdId]="selectedHouseholdId()" [refreshRevision]="v2WorkspaceRevision()" (newProductRequested)="startV2ProductCreate()" (newBatchRequested)="startV2BatchCreate($event)" (productSelected)="selectV2Product($event)" (groupSelected)="selectV2Group($event)" />
    <app-household-stock-panel
      [errorMessage]="errorMessage()"
      [existingShoppingLineItemIds]="existingShoppingLineItemIds()"
      [hasExistingShoppingList]="!!shoppingListPanel?.shoppingList()"
      [hasHouseholdPage]="!!householdPage()"
      [households]="households()"
      [loadState]="loadState()"
      [selectedHouseholdId]="selectedHouseholdId()"
      [selectedItemId]="selectedItem()?.id ?? null"
      [selectedShoppingItemIds]="selectedShoppingItemIds()"
      [showStockTable]="shoppingSelectionMode()"
      [shoppingSelectionMode]="shoppingSelectionMode()"
      [statusMessage]="statusMessage()"
      [stockItems]="stockItemsByPriority()"
      (createHouseholdRequested)="createHousehold($event)"
      (householdSelected)="selectHousehold($event)"
      (itemSelected)="openEditor($event)"
      (refreshRequested)="refreshHome()"
      (shoppingListAddRequested)="addStockItemToShoppingList($event, shoppingListPanel)"
      (shoppingSelectionToggled)="toggleShoppingItem($event)"
    />

    <app-household-product-editor [householdId]="selectedHouseholdId()" [product]="selectedV2Product()" [group]="selectedV2Group()" [batchOnly]="v2BatchEditorMode()" [resetRevision]="productEditorRevision()" (changed)="refreshV2Workspace()" />

    <app-household-shopping-list
      #shoppingListPanel
      class="shopping-bottom-row"
      [householdId]="selectedHouseholdId()"
      [shoppingScale]="apiShoppingScale()"
      [selectedStockItemIds]="shoppingSelectionMode() ? selectedShoppingItemIdsArray() : null"
      (stockPageUpdated)="applyShoppingListStockPage($event)"
    />
  </section>
}
