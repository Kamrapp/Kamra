@if (!auth.isAuthenticated()) {
  <app-household-preview-workspace
    [previewStockItems]="previewStockItems()"
    [previewEditorItem]="previewEditorItem()"
    [demoShoppingList]="demoShoppingList()"
    [shoppingScale]="apiShoppingScale()"
  />
} @else {
  <section class="stock-workspace" aria-labelledby="home-title">
    <section class="household-stock-layout">
      <app-household-v2-workspace
        [householdId]="selectedHouseholdId()"
        [refreshRevision]="v2WorkspaceRevision()"
        [shoppingSelectionMode]="shoppingSelectionMode()"
        [selectedShoppingOwnerIds]="selectedShoppingItemIds()"
        [shoppingSelectionScale]="apiShoppingScale()"
        (newProductRequested)="startV2ProductCreate($event)"
        (newBatchRequested)="startV2BatchCreate($event)"
        (productSelected)="selectV2Product($event)"
        (batchSelected)="selectV2Batch($event)"
        (groupSelected)="selectV2Group($event)"
        (shoppingSelectionToggled)="toggleShoppingItem($event)"
        (shoppingSelectionCandidatesChanged)="setShoppingSelectionCandidates($event)"
        (shoppingSelectionDefaultsChanged)="setShoppingSelectionDefaults($event)"
        (sectionExpandedChange)="v2WorkspaceExpanded.set($event)"
        (changed)="refreshV2Workspace()"
      />
      <aside class="household-editor-side">
        <app-household-stock-panel
          [errorMessage]="errorMessage()"
          [existingShoppingLineItemIds]="existingShoppingLineItemIds()"
          [hasExistingShoppingList]="!!shoppingListPanel?.shoppingList()"
          [hasHouseholdPage]="!!householdPage()"
          [households]="households()"
          [loadState]="loadState()"
          [selectedHouseholdId]="selectedHouseholdId()"
          [selectedItemId]="selectedItem()?.id ?? null"
          [selectedShoppingItemIds]="selectedShoppingItemIds()"
          [showStockTable]="false"
          [shoppingSelectionMode]="shoppingSelectionMode()"
          [statusMessage]="statusMessage()"
          [stockItems]="stockItemsByPriority()"
          (createHouseholdRequested)="createHousehold($event)"
          (householdSelected)="selectHousehold($event)"
          (itemSelected)="openEditor($event)"
          (refreshRequested)="refreshHome()"
          (shoppingListAddRequested)="addStockItemToShoppingList($event, shoppingListPanel)"
          (shoppingSelectionToggled)="toggleShoppingItem($event)"
          (invitationAccepted)="invitationAccepted($event)"
        />
        @if (v2WorkspaceExpanded()) {
          <app-household-product-editor
            [householdId]="selectedHouseholdId()"
            [product]="selectedV2Product()"
            [group]="selectedV2Group()"
            [batch]="selectedV2Batch()"
            [batchOnly]="v2BatchEditorMode()"
            [productCreateMode]="v2ProductCreateMode()"
            [resetRevision]="productEditorRevision()"
            (changed)="refreshV2Workspace()"
          />
        }
      </aside>
    </section>

    <app-household-shopping-list
      #shoppingListPanel
      class="shopping-bottom-row"
      [householdId]="selectedHouseholdId()"
      [shoppingScale]="apiShoppingScale()"
      [selectedOwnerIds]="shoppingSelectionMode() ? selectedShoppingItemIdsArray() : null"
      (stockPageUpdated)="applyShoppingListStockPage($event)"
    />
    <app-household-shopping-trip-panel
      class="shopping-bottom-row"
      [householdId]="selectedHouseholdId()"
    />
  </section>
}
