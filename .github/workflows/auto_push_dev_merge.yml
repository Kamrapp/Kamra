name: Auto Pull Request Action for Devs

on:
  push:
    branches:
      - master_dev_*
      - '!master_dev_gb'
      - '!master_dev_gyr'

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  create-pull-request:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Ensure master_dev exists
        shell: bash
        run: |
          set -euo pipefail

          if git ls-remote --exit-code --heads origin master_dev >/dev/null 2>&1; then
            echo "master_dev already exists."
            exit 0
          fi

          git fetch origin master --depth=1
          git push origin refs/remotes/origin/master:refs/heads/master_dev

      - name: pull-request
        uses: step-security/repo-sync-pull-request@v2
        with:
          destination_branch: "master_dev"
          github_token: ${{ secrets.GITHUB_TOKEN }}
          pr_template: ".github/pr_templ.md"
          pr_assignee: ${{ github.actor }}
          pr_reviewer: legrab,gyrz
          pr_allow_empty: false
          pr_title: ${{ github.event.head_commit.message }}
