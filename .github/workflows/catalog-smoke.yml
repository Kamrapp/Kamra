name: Catalog Smoke

on:
  pull_request:
    paths:
      - ".github/workflows/catalog-smoke.yml"
      - "package.json"
      - "package-lock.json"
      - "packages/kamra-api-server/src/catalog/**"
      - "packages/kamra-api-server/src/seeds/**"
      - "scripts/catalog-smoke.ts"
      - "scripts/generate-catalog-schemas.ts"
      - "scripts/seed.ts"
      - "tsconfig*.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog-smoke:
    runs-on: ubuntu-latest
    environment: Smoke

    env:
      MONGODB_URI: ${{ vars.MONGODB_URI || secrets.MONGODB_URI }}
      MONGODB_DB_NAME: ${{ vars.MONGODB_DB_NAME || secrets.MONGODB_DB_NAME }}
      MONGODB_DNS_SERVERS: ${{ vars.MONGODB_DNS_SERVERS || secrets.MONGODB_DNS_SERVERS }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Regenerate catalog schema artifact
        run: npm run contracts:catalog

      - name: Verify generated schema artifact is current
        run: git diff --exit-code -- packages/kamra-api-server/src/catalog/v1/generated/catalog-schemas.json

      - name: Typecheck API and scripts
        run: tsc -p tsconfig.api.json --noEmit

      - name: Run catalog tests
        run: npm test -- packages/kamra-api-server/src/catalog packages/kamra-api-server/src/seeds/catalog-v1-seed.test.ts

      - name: Smoke current catalog schema against MongoDB
        run: npm run smoke:catalog
