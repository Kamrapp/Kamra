name: App Checks

on:
  pull_request:
    paths:
      - ".github/workflows/app-checks.yml"
      - "angular.json"
      - "package.json"
      - "package-lock.json"
      - "proxy.conf.json"
      - "tsconfig*.json"
      - "src/**"
      - "api/**"
      - "packages/**"
      - "scripts/**"
  push:
    branches:
      - "main"
      - "master"
      - "dev/**"
    paths:
      - ".github/workflows/app-checks.yml"
      - "angular.json"
      - "package.json"
      - "package-lock.json"
      - "proxy.conf.json"
      - "tsconfig*.json"
      - "src/**"
      - "api/**"
      - "packages/**"
      - "scripts/**"

permissions:
  contents: read

jobs:
  app-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
