name: Process Ingestion

on:
  workflow_dispatch:
    inputs:
      source:
        description: Source to process. Use all for every pending source.
        required: true
        default: all
        type: choice
        options:
          - all
          - simple_html_table_shop
          - simple_pdf_shop
          - penny_hu_offers
          - aldi-hu-offers
          - coop-hu-offers
          - lidl-hu-brochure
      limit:
        description: Maximum raw snapshots to inspect.
        required: true
        default: "50"
        type: string
      reprocess:
        description: Reprocess snapshots even when the current processor already marked them processed.
        required: true
        default: false
        type: boolean
  schedule:
    - cron: "37 2 * * *"

permissions:
  contents: read

jobs:
  process-ingestion:
    runs-on: ubuntu-latest
    environment: Dev

    env:
      MONGODB_URI: ${{ vars.MONGODB_URI || secrets.MONGODB_URI }}
      MONGODB_DB_NAME: ${{ vars.MONGODB_DB_NAME || secrets.MONGODB_DB_NAME }}
      MONGODB_DNS_SERVERS: ${{ vars.MONGODB_DNS_SERVERS || secrets.MONGODB_DNS_SERVERS }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Print debug context to inspect scheduled/triggered result difference
        run: |
          echo "event=${{ github.event_name }}"
          echo "ref=${{ github.ref }}"
          echo "sha=${{ github.sha }}"
          echo "runner=${{ runner.name }}"
          echo "os=${{ runner.os }}"
          echo "public_ip=$(curl -s https://api.ipify.org)"
          date -u

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck API and scripts
        run: tsc -p tsconfig.api.json --noEmit

      - name: Run ingestion tests
        run: npm test -- packages/kamra-api-server/src/ingestion

      - name: Process raw ingestion snapshots
        shell: bash
        run: |
          set -euo pipefail

          source_name="${{ github.event.inputs.source || 'all' }}"
          limit="${{ github.event.inputs.limit || '50' }}"
          reprocess="${{ github.event.inputs.reprocess || 'false' }}"

          if ! [[ "$limit" =~ ^[1-9][0-9]*$ ]]; then
            echo "limit must be a positive integer"
            exit 1
          fi

          args=("--limit=$limit")

          case "$source_name" in
            all)
              ;;
            simple_html_table_shop|simple_pdf_shop|penny_hu_offers|aldi-hu-offers|coop-hu-offers|lidl-hu-brochure)
              args+=("--source=$source_name")
              ;;
            *)
              echo "Unsupported source: $source_name"
              exit 1
              ;;
          esac

          if [ "$reprocess" = "true" ]; then
            args+=("--reprocess")
          fi

          npm run process:ingestion -- "${args[@]}"

      - name: Validate processed ingestion
        run: npm run validate:processed-ingestion
