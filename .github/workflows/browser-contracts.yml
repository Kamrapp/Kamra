name: Browser Contracts

on:
  pull_request:
    paths:
      - ".github/workflows/browser-contracts.yml"
      - "angular.json"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.ts"
      - "proxy.conf.json"
      - "src/**"
      - "tests/browser/**"
      - "tsconfig*.json"
  push:
    branches:
      - "main"
      - "master"
      - "dev/**"
    paths:
      - ".github/workflows/browser-contracts.yml"
      - "angular.json"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.ts"
      - "proxy.conf.json"
      - "src/**"
      - "tests/browser/**"
      - "tsconfig*.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-contracts:
    name: Chromium browser contracts
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser contracts
        run: npm run test:browser
