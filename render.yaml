services:
  - type: web
    name: kamra-api
    runtime: node
    region: frankfurt
    branch: master
    autoDeploy: true
    buildCommand: npm ci && npm run build:api
    startCommand: npm run start:api:render
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_TOKEN_SECRET
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        sync: false
      - key: MONGODB_DNS_SERVERS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CORS_ALLOWED_ORIGIN_PATTERNS
        sync: false
  - type: web
    name: kamra-api-preview
    runtime: node
    region: frankfurt
    branch: master_dev
    autoDeploy: true
    buildCommand: npm ci && npm run build:api
    startCommand: npm run start:api:render
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_TOKEN_SECRET
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        sync: false
      - key: MONGODB_DNS_SERVERS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CORS_ALLOWED_ORIGIN_PATTERNS
        sync: false
